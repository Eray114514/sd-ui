name: Auto Deploy to Local Server

on:
  push:
    branches:
      - main # 监控 main 分支

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Trigger Local Deployment Script
        run: |
          echo "Received push event. Triggering deployment script..."
          
          # 因为 GitHub Runner 默认在 /home/<user>/actions-runner/_work 下执行
          # 我们需要跳转到你的项目目录去执行现有的部署脚本
          # 使用环境变量，如果你的项目在普通用户的 ~/projects/sd-ui 下
          SCRIPT_PATH="$HOME/projects/sd-ui/scripts/check-git-update.sh"
          
          if [ -f "$SCRIPT_PATH" ]; then
            echo "Executing $SCRIPT_PATH"
            bash "$SCRIPT_PATH"
          else
            echo "Error: Script not found at $SCRIPT_PATH"
            exit 1
          fi
          
          echo "Deployment script triggered successfully."
